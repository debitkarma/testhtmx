# compose file to run the redis server, web services, and queue-task

services:

  redis:
    container_name: redis
    ports:
      - 6379:6379
    image: redis:8.0-M03-alpine
  
  app:
    build: .
    image: web
    container_name: web
    ports:
      - 8080:8080
    command: python server.py
    volumes:
      - .:/app
    #environment:
    #  - VAR=value
    depends_on:
      - redis

